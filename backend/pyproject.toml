[project]
name = "brzask"
version = "0.0.0"
description = "Self-hosted daily news digest: exactly 7 articles worth reading, learned from what you open."
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pgvector>=0.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.40",
    "structlog>=25.4",
    "typer>=0.15",
]

[project.scripts]
brzask = "brzask.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PTH",     # pathlib
    "S",       # bandit
    "N",       # naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
# SQLAlchemy 2.0 typed models (Mapped[...]) need no plugin; its legacy plugin is deprecated.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["brzask"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
