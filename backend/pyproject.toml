[project]
name = "brzask"
version = "0.1.8"
description = "Self-hosted daily news digest: exactly 7 articles worth reading, learned from what you open."
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.156.5",
    "feedparser>=6.0.11",
    # SQLAlchemy 2.1 made it optional; the OpenTelemetry SQLAlchemy instrumentation needs it.
    "greenlet>=3.2",
    "httpx2>=2.14",
    "jinja2>=3.1",
    "openai>=3.35",
    "opentelemetry-api>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-exporter-prometheus>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45",
    "pgvector>=0.4",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.11",
    "sentry-sdk>=2.72",
    "sqlalchemy>=2.0.40",
    "structlog>=25.4",
    "trafilatura>=2.0",
    "typer>=0.15",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/tkabala/brzask"

[project.scripts]
brzask = "brzask.cli:run_cli"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
    "schemathesis>=4.32.2",
    "testcontainers[postgres]>=4.10",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PTH",     # pathlib
    "S",       # bandit
    "N",       # naming
]

[tool.ruff.lint.per-file-ignores]
# Tests use fake secrets and seeded random samples.
"tests/**" = ["S101", "S105", "S106", "S311"]
# Generated by alembic autogenerate.
"src/brzask/migrations/versions/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
# SQLAlchemy 2.0 typed models (Mapped[...]) need no plugin; its legacy plugin is deprecated.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# feedparser ships no type information; brzask.clients.feeds wraps it.
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# APScheduler 3 ships no type information; brzask.worker wraps it.
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["brzask"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.alembic]
# Used by the alembic CLI during development; the app builds the same config in code.
script_location = "brzask:migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"
