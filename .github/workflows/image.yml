name: Image

# Builds the image for amd64 and arm64, scans it, publishes it to GHCR with an
# SBOM and provenance, and signs it with cosign (keyless, through this
# workflow's GitHub identity).
#
# Called by the release workflow with the released version: tags 1.2.3, 1.2,
# 1 (from 1.0.0 on) and latest. Run by hand on a branch, it publishes `edge`
# and sha-<commit> instead.

on:
  workflow_call:
    inputs:
      version:
        description: Released version, e.g. 0.1.0
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
      security-events: write # Trivy results in code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !startsWith(inputs.version, '0.') }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=edge,enable=${{ inputs.version == '' }}
            type=sha,format=long,enable=${{ inputs.version == '' }}
          labels: |
            org.opencontainers.image.title=brzask
            org.opencontainers.image.description=Self-hosted daily news digest
            org.opencontainers.image.licenses=MIT

      # Scan before anything is published: a fixable critical vulnerability
      # stops the release; everything found goes to code scanning.
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: brzask:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan for the report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: brzask:scan
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: image
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: brzask:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Summary
        run: |
          fence='```'
          {
            echo "Published \`$IMAGE@$DIGEST\`:"
            echo
            while read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS"
            echo
            echo "Verify with:"
            echo
            echo "${fence}sh"
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity-regexp '^https://github.com/$REPOSITORY/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "$fence"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REPOSITORY: ${{ github.repository }}
