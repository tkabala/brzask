# brzask: the database, a one-shot migration, the API with the web app, and
# the worker that runs the daily pipelines.
#
#   docker compose run --rm setup   # writes ./secrets, asks for a login password
#   docker compose up -d            # then open http://localhost:8000
#
# Settings go in a .env file next to this one (see .env.example in the
# repository; TZ sets the time zone of the schedule). Secrets stay in
# ./secrets, one file each. Optional services:
#   crawler  Crawl4AI for pages plain HTTP cannot read. In .env:
#            COMPOSE_PROFILES=crawler and EXTRACTORS=feed,trafilatura,crawl4ai
#   search   SearXNG for source discovery. In .env:
#            COMPOSE_PROFILES=search and WEB_SEARCH=searxng
#   observability
#            Traces and metrics in Grafana at http://localhost:3000 (user
#            admin, password in ./secrets/grafana_admin_password). Needs the
#            observability folder next to this file (docs/observability.md).
#            In .env: COMPOSE_PROFILES=observability and
#            OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
# Several at once: COMPOSE_PROFILES=crawler,search.
name: brzask

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-brzask: &brzask
  image: ${BRZASK_IMAGE:-ghcr.io/tkabala/brzask:latest}
  restart: unless-stopped
  logging: *logging
  env_file:
    - path: .env
      required: false
  environment:
    DB_HOST: db
    # The image listens on every address at 8000; BRZASK_PUBLISH picks the host side.
    API_HOST: 0.0.0.0
    API_PORT: "8000"
    DB_PASSWORD_FILE: /run/secrets/db_password
    AUTH_PASSWORD_HASH_FILE: /run/secrets/auth_password_hash
    AUTH_SESSION_SECRET_FILE: /run/secrets/auth_session_secret
    LLM_API_KEY_FILE: /run/secrets/llm_api_key
    CRAWL4AI_API_TOKEN_FILE: /run/secrets/crawl4ai_api_token
    # The files above win over the same variables in .env, such as
    # DB_PASSWORD=brzask from a copied .env.example: empty counts as not set.
    DB_PASSWORD: ""
    AUTH_PASSWORD_HASH: ""
    AUTH_SESSION_SECRET: ""
    LLM_API_KEY: ""
    CRAWL4AI_API_TOKEN: ""
    CRAWL4AI_BASE_URL: ${CRAWL4AI_BASE_URL:-http://crawl4ai:11235}
    SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  secrets:
    - db_password
    - auth_password_hash
    - auth_session_secret
    - llm_api_key
    - crawl4ai_api_token

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: brzask
      POSTGRES_DB: brzask
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brzask -d brzask"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    <<: *brzask
    command: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *brzask
    command: api
    ports:
      # Loopback only; set BRZASK_PUBLISH=8000 to reach it from other machines,
      # or put a reverse proxy with TLS in front.
      - ${BRZASK_PUBLISH:-127.0.0.1:8000}:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *brzask
    command: worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  # `docker compose run --rm setup` writes the secret files; existing ones are kept.
  setup:
    image: ${BRZASK_IMAGE:-ghcr.io/tkabala/brzask:latest}
    profiles: [setup]
    # Root inside the container, to write into this directory whoever owns it;
    # ./secrets is then handed to that owner.
    user: root
    command: [setup, /deploy/secrets]
    volumes:
      - .:/deploy
      # Where the secrets section below reads them from.
      - ${BRZASK_SECRETS:-./secrets}:/deploy/secrets

  crawl4ai:
    image: unclecode/crawl4ai:0.9.5
    profiles: [crawler]
    restart: unless-stopped
    logging: *logging
    # Chromium needs more shared memory than Docker's default 64 MB.
    shm_size: 1g
    environment:
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
    secrets:
      # Its entrypoint reads the token from /run/secrets/api_token.
      - source: crawl4ai_api_token
        target: api_token

  searxng:
    image: searxng/searxng:2026.10.19-81371861f
    profiles: [search]
    restart: unless-stopped
    logging: *logging
    entrypoint:
      - sh
      - -c
      - SEARXNG_SECRET="$$(cat /run/secrets/searxng_secret)" exec /usr/local/searxng/entrypoint.sh
    secrets:
      - searxng_secret
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml

  # --- observability profile ---------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - prometheus
      - tempo

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      # A point or so a day per pipeline: a year of history takes little space.
      - --storage.tsdb.retention.time=400d
      - --web.enable-otlp-receiver
      # Every process (the worker after a restart, each command-line run)
      # starts its counters anew: a zero at the start time lets increase()
      # count its first run, and `anchored` ranges in the dashboard give exact
      # daily counts instead of extrapolating from a point or two a day.
      - --enable-feature=created-timestamp-zero-ingestion,promql-extended-range-selectors
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus

  tempo:
    image: grafana/tempo:3.1.1
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    command: [-target=all, -config.file=/etc/tempo.yaml]
    # The image runs as this user; the volume starts out owned by root.
    user: "10001"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    ports:
      # Loopback only, like the API; GRAFANA_PUBLISH=3000 opens it to other machines.
      - ${GRAFANA_PUBLISH:-127.0.0.1:3000}:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/brzask.json
      # No requests to grafana.com or elsewhere: no usage reports, update
      # checks, news, avatars or plugin downloads.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    secrets:
      - grafana_admin_password
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

volumes:
  db-data:
  prometheus-data:
  tempo-data:
  grafana-data:

configs:
  # Reachable only inside this network, where it answers brzask's JSON queries.
  searxng_settings:
    content: |
      use_default_settings: true
      server:
        limiter: false
        image_proxy: false
      search:
        formats: [html, json]

secrets:
  db_password:
    file: ${BRZASK_SECRETS:-./secrets}/db_password
  auth_password_hash:
    file: ${BRZASK_SECRETS:-./secrets}/auth_password_hash
  auth_session_secret:
    file: ${BRZASK_SECRETS:-./secrets}/auth_session_secret
  llm_api_key:
    file: ${BRZASK_SECRETS:-./secrets}/llm_api_key
  crawl4ai_api_token:
    file: ${BRZASK_SECRETS:-./secrets}/crawl4ai_api_token
  searxng_secret:
    file: ${BRZASK_SECRETS:-./secrets}/searxng_secret
  grafana_admin_password:
    file: ${BRZASK_SECRETS:-./secrets}/grafana_admin_password
