# Runs with prek (`prek install`) or pre-commit; both read this file.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        # pnpm-lock.yaml is multi-document; mkdocs.yml names a Python function (!!python/name)
        args: [--allow-multiple-documents, --unsafe]
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$  # JSONC
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, chore, docs, test, refactor, ci, build, perf, style, revert]

  # Linters run from the project environments so versions match the lockfiles.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types_or: [python, pyi]
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && pnpm exec prettier --write --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && pnpm exec eslint --fix "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
