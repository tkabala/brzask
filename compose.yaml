# Development services only. The deployment compose file lives in deploy/.
name: brzask-dev

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: brzask
      POSTGRES_PASSWORD: brzask
      POSTGRES_DB: brzask
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brzask -d brzask"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
