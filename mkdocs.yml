site_name: brzask
site_description: Self-hosted daily news digest that picks exactly 7 articles worth reading.
repo_url: https://github.com/tkabala/brzask
repo_name: tkabala/brzask
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Data model: data-model.md
  - HTTP API: api.md
  - Frontend: frontend.md
  - Measuring changes: measuring.md
  - Decisions:
      - decisions/index.md
      - decisions/0001-record-architecture-decisions.md
      - decisions/0002-trafilatura-as-the-default-page-extractor.md
      - decisions/0003-paid-web-search-for-discovery-is-optional.md
      - decisions/0004-no-vector-index-until-history-needs-one.md
      - decisions/0005-system-one-judgements-over-one-http-client.md
      - decisions/0006-llm-ranking-stays-the-default-over-composite-scores.md
      - decisions/0007-a-judge-decides-same-day-duplicates-in-the-grey-zone.md
      - decisions/0008-jev-stays-the-default-judge.md
      - decisions/0009-hand-set-composite-weights-until-opens-can-train-them.md
      - Template: decisions/0000-template.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
